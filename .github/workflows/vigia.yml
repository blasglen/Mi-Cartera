name: VIGÍA + Mesa (Telegram, cada 15 min)
on:
  schedule:
    # Lunes a viernes cada 15 min de 14 a 21:45 UTC = 11 a 18:45 hs Argentina
    # (BYMA abre 11:00, Wall Street 11:30 y cierra 18:00 hora AR).
    # GitHub a veces atrasa estas corridas 5-20 minutos.
    - cron: "*/15 14-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-writes
  cancel-in-progress: false
jobs:
  vigia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Calcular señales con precios en vivo
        run: node scripts/signals.mjs --live
      - name: VIGÍA revisa y avisa por Telegram
        env:
          TG_VIGIA: ${{ secrets.TG_VIGIA }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node scripts/vigia.mjs
      - name: La Mesa debate los avisos (RADAR, ANALISTA, CONTROL)
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_VIGIA: ${{ secrets.TG_VIGIA }}
          TG_RADAR: ${{ secrets.TG_RADAR }}
          TG_ANALISTA: ${{ secrets.TG_ANALISTA }}
          TG_CONTROL: ${{ secrets.TG_CONTROL }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
        # Si la IA falla, no frena el guardado de lo que hizo VIGÍA
        continue-on-error: true
        run: node scripts/mesa.mjs
      - name: REGISTRO anota señales y resultados (resumen los viernes)
        env:
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_CONTROL: ${{ secrets.TG_CONTROL }}
        continue-on-error: true
        run: node scripts/registro.mjs
      - name: Guardar señales y memoria de VIGÍA
        # Push con el GITHUB_TOKEN: a propósito NO dispara el deploy de la web.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/signals.json
          [ -f public/data/vigia-state.json ] && git add public/data/vigia-state.json
          [ -f public/data/registro.json ] && git add public/data/registro.json
          git diff --staged --quiet && exit 0
          git commit -m "VIGÍA $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main
          git push
