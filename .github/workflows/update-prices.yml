name: Actualizar precios diarios
on:
  schedule:
    - cron: "0 9 * * *"   # 9:00 UTC = 6:00 AR, antes de que abra el mercado
  workflow_dispatch:        # también se puede disparar a mano desde la pestaña Actions
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # Usamos un Personal Access Token en vez del GITHUB_TOKEN por
          # defecto: los pushes hechos con el token automático NO disparan
          # otros workflows (es una protección de GitHub contra loops
          # infinitos). Sin esto, este job actualiza los datos en el repo
          # pero deploy.yml nunca se entera y el sitio publicado se queda
          # viejo -- que es justo el bug que veníamos arrastrando.
          token: ${{ secrets.GH_PAT }}
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Correr el script de actualización
        run: node scripts/update-prices.mjs
        env:
          IOL_USERNAME: ${{ secrets.IOL_USERNAME }}
          IOL_PASSWORD: ${{ secrets.IOL_PASSWORD }}
      - name: Guardar los cambios en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --staged --quiet || git commit -m "Actualizar precios ($(date -u +%Y-%m-%d))"
          git push
