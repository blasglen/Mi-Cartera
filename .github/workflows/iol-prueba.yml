name: Prueba IOL en vivo (solo rama iol-en-vivo, no guarda nada)
on:
  push:
    branches: [iol-en-vivo]
  workflow_dispatch:
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Calcular señales con precios en vivo (IOL + data912)
        env:
          IOL_USERNAME: ${{ secrets.IOL_USERNAME }}
          IOL_PASSWORD: ${{ secrets.IOL_PASSWORD }}
        run: node scripts/signals.mjs --live
      - name: Mostrar algunos tickers
        run: node -e 'const s=require("./public/data/signals.json");for(const t of ["SPY","GGAL","NVDA","MELI","YPFD","QQQ"]){const x=s.tickers[t];console.log(t, x?.precio, x?.fuente, JSON.stringify(x?.dia||null))}'
